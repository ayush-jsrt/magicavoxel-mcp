[project]
name = "magicavoxel-mcp"
version = "0.1.0"
description = "MCP server for creating voxel art as MagicaVoxel .vox files"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.26",
    "opensimplex>=0.4",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["magicavoxel_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
