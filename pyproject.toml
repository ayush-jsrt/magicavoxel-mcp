[project]
name = "magicavoxel-mcp"
version = "0.1.0"
description = "MCP server for creating voxel art as MagicaVoxel .vox files"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "numpy>=1.26,<3.0",
    "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "anyio>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["magicavoxel_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
